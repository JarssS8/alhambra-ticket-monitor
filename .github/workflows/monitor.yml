name: Alhambra price monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_drop:
        description: 'Simular bajada de precio (prueba de Discord)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alhambra-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Cache Obscura
        id: obscura-cache
        uses: actions/cache@v4
        with:
          path: obscura-bin
          key: obscura-x86_64-linux-v1

      - name: Descargar Obscura
        if: steps.obscura-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p obscura-bin && cd obscura-bin
          curl -sSLO https://github.com/h4ckf0r0day/obscura/releases/latest/download/obscura-x86_64-linux.tar.gz
          tar xzf obscura-x86_64-linux.tar.gz && rm obscura-x86_64-linux.tar.gz


      - name: Recuperar estado anterior
        run: |
          mkdir -p state
          git fetch -q origin state && git show origin/state:prices.json > state/prices.json || echo "Sin estado previo (primera ejecución)"

      - name: Ejecutar monitor
        env:
          OBSCURA_BIN: ./obscura-bin/obscura
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          TEST_DROP: ${{ inputs.test_drop || 'false' }}
        shell: bash
        run: |
          set -o pipefail
          python monitor.py 2>&1 | tee run.log
      - name: Resumen para diagnóstico
        if: always()
        shell: bash
        run: |
          [ -f run.log ] || exit 0
          if [ "${{ job.status }}" = "success" ]; then T=notice; else T=error; fi
          echo "::$T title=monitor::$(tail -c 1500 run.log | sed 's/%/%25/g' | tr '\n' '|')"

      - name: Volcar página en fallo
        if: failure()
        run: |
          mkdir -p dbg && cp page.html dbg/ 2>/dev/null || true
          cd dbg && git init -q -b debug && git config user.email "bot@users.noreply.github.com" && git config user.name bot
          git add -A && git commit -qm dbg && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" debug

      - name: Guardar estado
        if: success() && inputs.test_drop != true
        run: |
          cd state
          git init -q -b state
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add prices.json
          git commit -qm "estado $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state
