name: 🎫 Alhambra Ticket Monitor - Cada 5 minutos

on:
  schedule:
    # Ejecutar cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Permitir ejecución manual

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Chromium
        run: |
          apt-get update
          apt-get install -y chromium-browser chromium-chromedriver
      
      - name: Run Alhambra Monitor
        env:
          # Discord
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # Telegram (opcional)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Email (opcional)
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          echo "🎫 Monitor Alhambra - $(date)"
          python monitor.py --once
          echo "✅ Ciclo completado"
      
      - name: Upload history & logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alhambra-monitor-data
          path: |
            alhambra_history.json
            alhambra_monitor.log
          retention-days: 30
          if-no-files-found: ignore
